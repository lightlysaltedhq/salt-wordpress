name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHPCS + PHPUnit + snapshot gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP (fleet minimum)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPCS — WordPress-Extra + WordPress.Security.* as errors (SEC08)
        run: vendor/bin/phpcs

      - name: PHPUnit — unit suite (§5.2 shared logic)
        run: vendor/bin/phpunit --testsuite unit

      - name: Rendered-markup snapshot gate (FLEET01)
        run: vendor/bin/phpunit --testsuite snapshot

      - name: DEP01 — theme survives with ACF absent (no fatal)
        run: php bin/check-acf-absent.php

      # This gate existed and worked, but nothing ran it: it was absent from CI and from
      # package.json, and only comments referenced it. tests/unit/ColorVectorsTest.php's
      # docstring describes it as the JS half of a PHP<->JS parity pair, so half the pair
      # was unenforced. Wiring it in costs one line.
      - name: PHP↔JS colour-math parity (§13) — the JS port matches the fixture
        run: node bin/check-color-parity.mjs

  conformance:
    name: Conformance vs base-design-system
    runs-on: ubuntu-latest
    steps:
      # Side-by-side layout: tests/conformance/BaseConformanceTest.php resolves the contract
      # at ../base-design-system, so this repo needs an explicit path too — the default
      # checkout would land in $GITHUB_WORKSPACE itself and the sibling would not exist.
      #
      #   $GITHUB_WORKSPACE/
      #     salt/                  <- this repo
      #     base-design-system/    <- the contract
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: salt

      # base-design-system is private, so the default GITHUB_TOKEN cannot read it — it is
      # scoped to this repo alone. BASE_DS_KEY is the private half of a read-only deploy key
      # registered on base-design-system. Deploy keys do not expire; a PAT would, and both
      # consumers' CI would go red on the same day for a reason nobody remembers.
      - name: Check out the contract
        uses: actions/checkout@v4
        with:
          repository: otigs/base-design-system
          ssh-key: ${{ secrets.BASE_DS_KEY }}
          path: base-design-system

      - name: Set up PHP (fleet minimum)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        working-directory: salt
        run: composer install --prefer-dist --no-progress

      # Fails closed and never skips: salt cannot claim to conform to a contract it cannot
      # read. Both of this fleet's gates once returned 0 on skip, so CI passed green while
      # verifying nothing (fixed in ls-design-system@eb3011b). Do not reintroduce it.
      - name: Derivation vs frozen vectors + required role vocabulary
        working-directory: salt
        run: vendor/bin/phpunit --testsuite conformance

  js:
    name: ESLint + Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

  integrity:
    name: Artifact integrity (FLEET08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Rebuild assets/dist and fail on any byte difference
        run: |
          npm run build
          git add -A assets/dist
          git diff --cached --exit-code --stat -- assets/dist

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Re-vendor runtime libs from lock and byte-compare committed vendor/
        run: |
          COMPOSER_VENDOR_DIR=/tmp/vendor-check composer install --no-dev --prefer-dist --no-progress --no-plugins
          diff -r vendor/enshrined /tmp/vendor-check/enshrined

  slugs:
    name: Slug stability (FLEET07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Registry matches field code (no stale registry)
        run: php bin/extract-slugs.php --check

      - name: No slug removed without major bump or migration entry
        run: php bin/check-slug-stability.php
