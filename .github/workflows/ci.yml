name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHPCS + PHPUnit + snapshot gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP (fleet minimum)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPCS — WordPress-Extra + WordPress.Security.* as errors (SEC08)
        run: vendor/bin/phpcs

      - name: PHPUnit — unit suite (§5.2 shared logic)
        run: vendor/bin/phpunit --testsuite unit

      - name: Rendered-markup snapshot gate (FLEET01)
        run: vendor/bin/phpunit --testsuite snapshot

      - name: DEP01 — theme survives with ACF absent (no fatal)
        run: php bin/check-acf-absent.php

  conformance:
    name: Conformance vs design-foundations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The contract is @lightlysaltedhq/design-foundations, a public npm package pinned
      # exactly in package.json and locked by integrity hash in package-lock.json. npm ci
      # installs it from the lock, so CI reads the version committed here and nothing else:
      # a new contract release changes nothing until a PR bumps the pin on purpose. This
      # replaced a second checkout of the private base-design-system repository, which had
      # no ref and so floated on whatever its HEAD was.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Set up PHP (fleet minimum)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      # Fails closed and never skips: salt cannot claim to conform to a contract it cannot
      # read. Both of this fleet's gates once returned 0 on skip, so CI passed green while
      # verifying nothing (fixed in ls-design-system@eb3011b). Do not reintroduce it.
      - name: Contract pin + derivation vs frozen vectors + required roles + contrast in every display mode
        run: vendor/bin/phpunit --testsuite conformance

      # The page sections' and the collections' fields are the pinned salt-contract's (ID-3610
      # parts A and B): the committed inc/fields/generated/sections.json and collections.json must
      # be the pinned emitter's output, byte for byte, and the theme must register exactly those
      # layouts and collection groups, with no hand-written copy and no inc/fields/cpt-*.php.
      # Needs the npm ci above (the emitter runs from node_modules) and PHP.
      - name: Section and collection fields generated from the pinned salt-contract (drift check)
        run: php bin/check-fields-from-contract.php

  js:
    name: ESLint + Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      # This gate existed and worked, but nothing ran it: it was absent from CI and from
      # package.json, and only comments referenced it. tests/unit/ColorVectorsTest.php's
      # docstring describes it as the JS half of a PHP<->JS parity pair, so half the pair
      # was unenforced. It runs here, after npm ci, because it also reads the contract's
      # quantise vectors from node_modules and fails closed without them.
      - name: PHP↔JS colour-math parity (§13) — the JS port matches the fixture and the contract's quantise vectors
        run: node bin/check-color-parity.mjs

  integrity:
    name: Artifact integrity (FLEET08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Rebuild assets/dist and fail on any byte difference
        run: |
          npm run build
          git add -A assets/dist
          git diff --cached --exit-code --stat -- assets/dist

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Re-vendor runtime libs from lock and byte-compare committed vendor/
        run: |
          COMPOSER_VENDOR_DIR=/tmp/vendor-check composer install --no-dev --prefer-dist --no-progress --no-plugins
          diff -r vendor/enshrined /tmp/vendor-check/enshrined

  slugs:
    name: Slug stability (FLEET07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Registry matches field code (no stale registry)
        run: php bin/extract-slugs.php --check

      - name: No slug removed without major bump or migration entry
        run: php bin/check-slug-stability.php

      # The gate's own cases (ID-3943): a field moved into or out of a group, a renamed
      # group or repeater, and a removed layout fail a non-major bump. Throwaway repo in
      # a temp dir; needs php and git only.
      - name: Slug-stability gate self-test
        run: bash bin/check-slug-stability.test.sh
  
  real-acf:
    name: Real ACF Pro harness (PHP ${{ matrix.php }})
    # The contract's field shape on real ACF Pro 6.8.11 and WordPress 7.1.5 (tests/real-acf/README.md).
    # ACF Pro comes from ACF's private Composer repository, so this job needs two repository
    # secrets: ACF_PRO_KEY (the licence key, Composer's username) and ACF_PRO_SITE_URL (a site
    # URL already activated on the licence, with https://, Composer's password). It fails, never
    # skips, when they are missing.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.5' ]
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # The pinned salt-contract the harness emits from.
      - run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer
          coverage: none

      - name: Install ACF Pro 6.8.11 by Composer (tests/real-acf/acf-composer)
        env:
          ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
          ACF_PRO_SITE_URL: ${{ secrets.ACF_PRO_SITE_URL }}
        run: |
          if [ -z "$ACF_PRO_KEY" ] || [ -z "$ACF_PRO_SITE_URL" ]; then
            echo "::error::Set the ACF_PRO_KEY and ACF_PRO_SITE_URL repository secrets (tests/real-acf/README.md)."
            exit 1
          fi
          COMPOSER_AUTH="$(jq -nc --arg u "$ACF_PRO_KEY" --arg p "$ACF_PRO_SITE_URL" '{"http-basic": {"connect.advancedcustomfields.com": {"username": $u, "password": $p}}}')"
          export COMPOSER_AUTH
          composer install --working-dir=tests/real-acf/acf-composer --no-interaction --no-progress --prefer-dist

      - name: Install the harness's WordPress and Playwright
        run: |
          composer install --working-dir=tests/real-acf --no-interaction --no-progress --prefer-dist
          npm ci --prefix tests/real-acf
          (cd tests/real-acf && npx playwright install --with-deps chromium-headless-shell)

      - name: Run the harness
        env:
          SALT_HARNESS_DB_HOST: 127.0.0.1:3306
          SALT_HARNESS_DB_USER: root
          SALT_HARNESS_DB_PASSWORD: ''
          SALT_ACF_DIR: tests/real-acf/acf-composer/vendor/wpengine/advanced-custom-fields-pro
        run: tests/real-acf/run.sh --php ${{ matrix.php }} --report real-acf-report.txt

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-acf-report-php${{ matrix.php }}
          path: real-acf-report.txt
          if-no-files-found: ignore

  release-tag:
    name: Release tag gate
    # Tag pushes only; on pull requests this job is listed as Skipped. Git Updater
    # offers the newest tag and needs the style.css Version to match it. This runs
    # after the tag is pushed: it flags a mismatched or off-main tag, it cannot stop it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Full history, so origin/main exists and the ancestry test is real.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Version headers equal the tag, and the tag is on main
        run: node bin/check-release-tag.mjs "$GITHUB_REF_NAME"
